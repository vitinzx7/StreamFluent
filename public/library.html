<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>StreamFluent — Biblioteca de estudo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 24px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      color: #00d4aa;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar input,
    .toolbar select {
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .toolbar input { flex: 1; min-width: 160px; }
    .toolbar select { min-width: 120px; }
    .toolbar button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #1a3a5c; }
    .count {
      font-size: 12px;
      color: #555;
      margin-bottom: 16px;
    }
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #555;
    }
    .card {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .card-word {
      color: #00d4aa;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card-translation {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .card-definition {
      font-size: 12px;
      color: #7d7d7d;
      margin-bottom: 6px;
    }
    .card-sentence {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 8px;
      font-style: italic;
    }
    .card-sentence-translation {
      font-size: 13px;
      color: #7ee8d0;
      margin-bottom: 8px;
      font-style: italic;
    }
    .card-meta {
      font-size: 11px;
      color: #666;
    }
    .card-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 16px;
    }
    .card-delete:hover { color: #e74c3c; }
    .card-sentence,.card-sentence-translation { white-space:pre-wrap; }
    .difficult { color:#FF8A80; } .learned { color:#81C784; }
    nav { display:flex; gap:8px; margin:20px 0; flex-wrap:wrap; }
    nav button,.card-action { padding:8px; background:#26344c; color:#e0e0e0; border:1px solid #536078; border-radius:5px; cursor:pointer; margin-right:6px; }
    [aria-selected="true"] { border-color:#00d4aa; }
    :focus-visible { outline:2px solid #8ECBFF; outline-offset:3px; }
    [hidden] { display:none!important; }
  </style>
</head>
<body>
  <h1>Biblioteca de estudo</h1>
  <p class="subtitle">Frases e palavras salvas localmente enquanto você estuda.</p>
  <nav role="tablist" aria-label="Biblioteca"><button role="tab" data-tab="phrases">Frases salvas</button><button role="tab" data-tab="difficult">Palavras difíceis</button><button role="tab" data-tab="learned">Palavras aprendidas</button></nav>
  <div class="toolbar">
    <input type="text" id="search" aria-label="Buscar palavra ou contexto" placeholder="Buscar palavra ou contexto…" />
    <select id="platformFilter" aria-label="Plataforma">
      <option value="">All platforms</option>
    </select>
    <select id="languageFilter" aria-label="Idioma"><option value="">Todos os idiomas</option></select>
    <button id="clearAll">Apagar todas as frases</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list">
    <p class="empty">No phrases saved yet.</p>
  </div>
  <p id="feedback" role="status" aria-live="polite"></p>
  <script src="study-client.js"></script>
  <script src="library.js"></script>
</body>
</html>
