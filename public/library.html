<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StreamFluent — Biblioteca</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    .count { margin: 0; color: var(--faint); font-size: 14px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .toolbar input, .toolbar select { width: auto; margin: 0; padding: 8px 12px; font-size: 14px; }
    .toolbar input { flex: 1; min-width: 180px; }
    .toolbar select { min-width: 140px; }
    #clearAll { align-self: center; margin-left: auto; font-size: 14px; }
    .empty { padding: 48px 0; color: var(--faint); text-align: center; }
    .card { margin-bottom: 10px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .card-word { margin-bottom: 4px; font-size: 16px; font-weight: 600; }
    .card-translation { margin-bottom: 6px; color: var(--muted); font-size: 14px; }
    .card-definition { margin-bottom: 6px; color: var(--faint); font-size: 13px; }
    .card-sentence { margin-bottom: 6px; font-size: 14px; font-style: italic; }
    .card-sentence-translation { margin-bottom: 8px; color: var(--muted); font-size: 14px; font-style: italic; }
    .card-sentence, .card-sentence-translation { white-space: pre-wrap; }
    .card-meta { margin-bottom: 4px; color: var(--faint); font-size: 12px; }
    .card-action { margin: 8px 6px 0 0; padding: 6px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="app-header"><div class="app-bar">
    <span class="brand">StreamFluent</span>
    <nav class="tabs" aria-label="Seções">
      <button type="button" data-tab="phrases">Frases salvas</button><button type="button" data-tab="difficult">Palavras difíceis</button><button type="button" data-tab="learned">Palavras aprendidas</button><a href="account.html">Conta</a>
    </nav>
  </div></header>
  <main>
    <div class="page-head"><h1 id="viewTitle">Frases salvas</h1><p class="count" id="count"></p><button type="button" id="clearAll" class="quiet danger">Apagar todas as frases</button></div>
    <div class="toolbar">
      <input type="text" id="search" aria-label="Buscar palavra ou contexto" placeholder="Buscar palavra ou contexto…" />
      <select id="platformFilter" aria-label="Plataforma"><option value="">Todas as plataformas</option></select>
      <select id="languageFilter" aria-label="Idioma"><option value="">Todos os idiomas</option></select>
    </div>
    <div id="list"><p class="empty">Carregando…</p></div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
  <script src="study-client.js"></script>
  <script src="library.js"></script>
</body>
</html>
