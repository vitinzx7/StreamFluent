<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StreamFluent — My Phrases</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 24px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      color: #00d4aa;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .toolbar input,
    .toolbar select {
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    .toolbar input { flex: 1; min-width: 160px; }
    .toolbar select { min-width: 120px; }
    .toolbar button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
    }
    .toolbar button:hover { background: #1a3a5c; }
    .count {
      font-size: 12px;
      color: #555;
      margin-bottom: 16px;
    }
    .empty {
      text-align: center;
      padding: 48px 0;
      color: #555;
    }
    .card {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .card-word {
      color: #00d4aa;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card-translation {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .card-definition {
      font-size: 12px;
      color: #7d7d7d;
      margin-bottom: 6px;
    }
    .card-sentence {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 8px;
      font-style: italic;
    }
    .card-sentence-translation {
      font-size: 13px;
      color: #7ee8d0;
      margin-bottom: 8px;
      font-style: italic;
    }
    .card-meta {
      font-size: 11px;
      color: #666;
    }
    .card-delete {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 16px;
    }
    .card-delete:hover { color: #e74c3c; }
  </style>
</head>
<body>
  <h1>My Phrases</h1>
  <p class="subtitle">Phrases you saved while watching.</p>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search phrases..." />
    <select id="platformFilter">
      <option value="">All platforms</option>
    </select>
    <button id="clearAll">Clear All</button>
  </div>
  <p class="count" id="count"></p>
  <div id="list">
    <p class="empty">No phrases saved yet.</p>
  </div>
  <script src="library.js"></script>
</body>
</html>
