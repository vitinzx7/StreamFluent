<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #17181a;
      color: #ececed;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #ececed;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .account {
      padding: 5px 10px;
      border: 1px solid #3c3f45;
      border-radius: 6px;
      background: none;
      color: #ececed;
      font-size: 12px;
      cursor: pointer;
    }
    .account:hover {
      border-color: #5b5f67;
    }
    .status {
      font-size: 13px;
      color: #a1a4ab;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid #2a2c30;
      border-radius: 6px;
      background: #1f2023;
      color: #ececed;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .btn:hover {
      border-color: #5b5f67;
    }
    .btn + .btn {
      margin-top: 8px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #70737b;
      margin-bottom: 6px;
    }
    .field select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #3c3f45;
      border-radius: 6px;
      background: #0f1011;
      color: #ececed;
      font-size: 13px;
      cursor: pointer;
    }
    .hint {
      font-size: 11px;
      color: #70737b;
      margin-top: 6px;
    }
    .field .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: #ececed;
      cursor: pointer;
      margin-bottom: 0;
    }
    .toggle input {
      width: 15px;
      height: 15px;
      accent-color: #ececed;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top"><h1>StreamFluent</h1><button class="account" id="openAccount">Conta</button></div>
  <p class="status" id="status">Checking current page...</p>
  <div class="field">
    <label for="direction">Translation</label>
    <select id="direction">
      <option value="en-pt">English &rarr; Portugu&ecirc;s</option>
      <option value="pt-en">Portugu&ecirc;s &rarr; English</option>
    </select>
    <p class="hint" id="directionHint">Applies to the next subtitle line.</p>
  </div>
  <div class="field">
    <label class="toggle" for="showTranslation">
      <input type="checkbox" id="showTranslation" />
      <span>Show translated subtitle line</span>
    </label>
  </div>
  <div class="field">
    <label for="level">Meu nível de inglês</label>
    <select id="level">
      <option value="">Escolher…</option>
      <option value="A1">A1 · Iniciante</option>
      <option value="A2">A2 · Básico</option>
      <option value="B1">B1 · Intermediário</option>
      <option value="B2">B2 · Intermediário avançado</option>
      <option value="C1">C1 · Avançado</option>
      <option value="C2">C2 · Proficiente</option>
    </select>
    <p class="hint">Palavras em inglês acima do seu nível ficam em lilás.</p>
  </div>
  <div class="field"><label class="toggle"><input type="checkbox" id="highlightNewWords">Destacar palavras novas</label></div>
  <div class="field"><label class="toggle"><input type="checkbox" id="highlightSpecialWords">Destacar palavras acima do meu nível</label></div>
  <div class="field"><label class="toggle"><input type="checkbox" id="autoPause">Pausa automática</label></div>
  <button class="btn" id="openLibrary">Frases salvas</button>
  <button class="btn" id="openDifficult">Palavras difíceis</button>
  <button class="btn" id="openPlayerTest">Testar player local</button>
  <script src="study-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
