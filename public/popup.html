<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #00d4aa;
      margin-bottom: 12px;
    }
    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #1a3a5c;
    }
    .btn + .btn {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>StreamFluent</h1>
  <p class="status" id="status">Checking current page...</p>
  <button class="btn" id="openLibrary">My Phrases</button>
  <script src="popup.js"></script>
</body>
</html>
